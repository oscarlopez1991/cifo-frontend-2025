<section class="bg-white dark:bg-gray-900 flex flex-col">
  <div class="max-w-screen-xl w-full mx-auto px-4 py-8 lg:py-12 text-center">
    <h1 class="mb-2 text-4xl font-extrabold text-gray-900 dark:text-white">
      Crypto Analytics
    </h1>
    <p class="text-gray-500 dark:text-gray-400">
      Advanced charts and technical analysis
    </p>
  </div>
  <div
    class="flex flex-col w-full h-full bg-white dark:bg-gray-800 rounded-lg shadow p-4"
  >
    <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-4">
      <div>
        <select
          id="coin-select"
          class="p-2 rounded border border-gray-300 dark:bg-gray-800 dark:text-white dark:border-gray-700"
        >
          <option value="bitcoin">BTC</option>
          <option value="ethereum">ETH</option>
          <option value="solana">SOL</option>
        </select>
        <div
          id="metric-price"
          class="text-2xl font-bold text-gray-900 dark:text-white mt-4"
        >
          --
        </div>
      </div>
      <div
        id="metric-change"
        class="text-base font-medium text-green-500 dark:text-green-400"
      >
        --
      </div>
    </div>
    <div id="analytics-chart" class="flex-1 min-h-[300px] h-full w-full"></div>
    <div>
      <select
        id="period-select"
        class="p-2 rounded border border-gray-300 dark:bg-gray-800 dark:text-white dark:border-gray-700"
      >
        <option value="1">1D</option>
        <option value="7">1W</option>
        <option value="30">1M</option>
      </select>
    </div>
  </div>
</section>
