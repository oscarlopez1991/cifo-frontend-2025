<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style-specificity.css">
    <title>Specificity</title>
  </head>
  <body>
    <section id="main-section" class="container">
      <p id="first-paragraph" class="paragraph">Here first paragraph!!</p>
      <!-- inline specificity: 1, 0, 0, 0 -->
      <p id="second-paragraph" style="color: white" class="paragraph">Here second paragraph with inline color!!</p>
      <div id="nested-div" class="container">
        <p id="nested-paragraph" class="paragraph"> Here nested paragraph!!</p>
      </div>
    </section>
  </body>
</html>
