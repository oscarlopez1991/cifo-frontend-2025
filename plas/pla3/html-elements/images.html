<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/base-style.css">
    <link rel="stylesheet" href="css/images-style.css">
    <meta name="author" content="Oscar Lopez"/>
    <meta charset="UTF-8">
    <title>Images</title>
  </head>
  <body>
    <h1>Images with CSS</h1>
    <p>We can reference local or remote images. To reference local images, we must always use relative paths.</p>
    <h2>Local Image</h2>
    <img src="img/local-image.png" alt="Local image"/>
    <h2>Remote Image</h2>
    <img src="https://picsum.photos/500/300" alt="Remote image"/>
  </body>
</html>
