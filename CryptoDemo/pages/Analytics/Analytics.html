<section class="bg-white dark:bg-gray-900 min-h-[60vh]">
  <div class="max-w-screen-md mx-auto px-4 py-8 lg:py-16">
    <div
      class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 max-w-lg mx-auto"
    >
      <div class="flex justify-between items-center mb-4">
        <div>
          <div
            id="metric-price"
            class="text-3xl font-bold text-gray-900 dark:text-white"
          >
            --
          </div>
          <div
            id="metric-change"
            class="text-base font-medium text-green-500 dark:text-green-400"
          >
            --
          </div>
        </div>
        <div class="flex gap-2">
          <select
            id="coin-select"
            class="p-2 rounded border border-gray-300 dark:bg-gray-800 dark:text-white dark:border-gray-700"
          >
            <option value="bitcoin">BTC</option>
            <option value="ethereum">ETH</option>
            <option value="solana">SOL</option>
          </select>
          <select
            id="period-select"
            class="p-2 rounded border border-gray-300 dark:bg-gray-800 dark:text-white dark:border-gray-700"
          >
            <option value="1">1D</option>
            <option value="7">1W</option>
            <option value="30">1M</option>
          </select>
        </div>
      </div>
      <div id="analytics-chart" class="min-h-[300px]"></div>
    </div>
  </div>
</section>
