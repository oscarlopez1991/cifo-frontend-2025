<!-- Templates file: contains reusable HTML templates for dynamic content rendering -->

<!-- Coin row template: used for displaying cryptocurrency data in the markets table -->
<template id="coin-row-template">
  <tr>
    <!-- Table header cell for coin name and image -->
    <th
      scope="row"
      class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white"
    >
      <div class="flex items-center">
        <!-- Coin image -->
        <img class="h-6 w-6 mr-2" src="" alt="" />
        <!-- Coin name and symbol -->
        <span class="coin-name"></span>
      </div>
    </th>
    <!-- Price cell -->
    <td class="px-6 py-4 price"></td>
    <!-- Market cap cell -->
    <td class="px-6 py-4 market-cap"></td>
    <!-- Volume cell, highlighted in blue -->
    <td class="px-6 py-4 text-blue-600 dark:text-blue-500 volume"></td>
    <!-- 24h change cell -->
    <td class="px-6 py-4 change"></td>
  </tr>
</template>

<!-- News card template: used for displaying news articles in the news page -->
<template id="news-card-template">
  <div
    class="bg-white rounded-lg shadow-lg overflow-hidden dark:bg-gray-700 hover:shadow-xl transition-shadow h-96 flex flex-col"
  >
    <!-- News image with fallback on error -->
    <img
      src=""
      alt=""
      class="w-full h-48 object-cover flex-shrink-0"
      onerror="this.src='https://picsum.photos/300/200'"
    />
    <div class="p-6 flex flex-col">
      <!-- News title -->
      <h3
        class="mb-2 text-xl font-bold text-gray-900 dark:text-white line-clamp-2"
      ></h3>
      <!-- News description -->
      <p class="text-gray-500 dark:text-gray-400 mb-4 line-clamp-2"></p>
      <!-- Read more link -->
      <a
        href=""
        target="_blank"
        class="text-blue-600 dark:text-blue-400 hover:underline mt-auto"
        >Read more</a
      >
    </div>
  </div>
</template>

<!-- Trending card template: used for displaying trending coins in the news page -->
<template id="trending-card-template">
  <div class="bg-white rounded-lg shadow-lg p-6 dark:bg-gray-700">
    <div class="flex items-center mb-4">
      <!-- Coin image -->
      <img src="" alt="" class="h-10 w-10 mr-3" />
      <div>
        <!-- Coin name -->
        <h3 class="text-xl font-bold text-gray-900 dark:text-white"></h3>
        <!-- Coin symbol -->
        <p class="text-gray-500 dark:text-gray-400 uppercase"></p>
      </div>
    </div>
    <!-- Price in BTC -->
    <p class="text-gray-500 dark:text-gray-400"></p>
  </div>
</template>

<!-- Error display template: used for displaying error messages in pages -->
<template id="error-display-template">
  <div class="flex items-center justify-center min-h-screen">
    <div class="text-center">
      <svg
        class="mx-auto h-12 w-12 text-red-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
      <h3
        class="mt-2 text-xl font-medium text-gray-900 dark:text-white error-title"
      >
        Error
      </h3>
      <p
        class="mt-1 text-sm text-gray-500 dark:text-gray-400 error-message"
      ></p>
      <button
        onclick="location.reload()"
        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
      >
        Reload Page
      </button>
    </div>
  </div>
</template>
