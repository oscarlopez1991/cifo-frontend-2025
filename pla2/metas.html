<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="author" content="Oscar Lopez">
    <meta name="description" content="HTML metadata demonstration page">
    <meta name="keywords" content="HTML, metadata, charset">
    <title>Metadata</title>
  </head>
  <body>
    <h1>Common &lt;meta&gt; tags</h1>
    <p><strong>Charset:</strong> Defines the document's character encoding, usually UTF-8.</p>
    <p><strong>Author:</strong> Specifies the author of the document.</p>
    <p><strong>Description:</strong> A summary of the page content, useful for SEO.</p>
    <p><strong>Keywords:</strong> Keywords related to the content.</p>
  </body>
</html>
