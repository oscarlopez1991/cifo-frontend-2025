<section class="bg-white dark:bg-gray-900">
  <div class="max-w-screen-xl mx-auto">
    <div class="text-center mb-6">
      <h1 class="mb-2 text-4xl font-extrabold text-gray-900 dark:text-white">
        Cryptocurrency Markets
      </h1>
      <p class="text-gray-500 dark:text-gray-400">
        Prices, market cap, volume and 24h change
      </p>
    </div>

    <!-- Top controls -->
    <div
      class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-4"
    >
      <!-- Search -->
      <div class="w-full md:w-1/2">
        <label for="market-search" class="sr-only">Search</label>
        <!-- Search input -->
        <div class="relative">
          <div
            class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none"
          >
            <svg
              class="w-4 h-4 text-gray-500 dark:text-gray-400"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 20 20"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
              />
            </svg>
          </div>
          <input
            id="market-search"
            type="text"
            placeholder="Search coin..."
            class="block w-full p-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-800 dark:border-gray-700 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          />
        </div>
      </div>

      <!-- Page size -->
      <div class="flex items-center gap-2">
        <!-- Page size select -->
        <label
          for="rows-per-page"
          class="text-sm text-gray-600 dark:text-gray-400"
          >Rows per page</label
        >
        <select
          id="rows-per-page"
          class="p-2 text-sm border border-gray-300 rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        >
          <option>5</option>
          <option selected>10</option>
          <option>15</option>
          <option>25</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div
      class="relative overflow-x-auto shadow-lg rounded-lg border border-gray-200 dark:border-gray-700"
    >
      <table
        class="w-full text-sm text-left text-gray-500 dark:text-gray-400"
        id="markets-table"
      >
        <thead
          class="text-xs uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
        >
          <tr>
            <th scope="col" class="px-6 py-3">
              <button
                class="sort-btn inline-flex items-center gap-1"
                data-key="name"
              >
                Coin
                <svg
                  class="w-3 h-3 opacity-60 sort-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path d="M7 10l5-6 5 6H7zm0 4h10l-5 6-5-6z" />
                </svg>
              </button>
            </th>
            <th scope="col" class="px-6 py-3">
              <button
                class="sort-btn inline-flex items-center gap-1"
                data-key="price"
              >
                Price
                <svg
                  class="w-3 h-3 opacity-60 sort-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path d="M7 10l5-6 5 6H7zm0 4h10l-5 6-5-6z" />
                </svg>
              </button>
            </th>
            <th scope="col" class="px-6 py-3">
              <button
                class="sort-btn inline-flex items-center gap-1"
                data-key="marketCap"
              >
                Market Cap
                <svg
                  class="w-3 h-3 opacity-60 sort-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path d="M7 10l5-6 5 6H7zm0 4h10l-5 6-5-6z" />
                </svg>
              </button>
            </th>
            <th scope="col" class="px-6 py-3">
              <button
                class="sort-btn inline-flex items-center gap-1"
                data-key="volume"
              >
                24h Volume
                <svg
                  class="w-3 h-3 opacity-60 sort-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path d="M7 10l5-6 5 6H7zm0 4h10l-5 6-5-6z" />
                </svg>
              </button>
            </th>
            <th scope="col" class="px-6 py-3">
              <button
                class="sort-btn inline-flex items-center gap-1"
                data-key="change"
              >
                24h Change
                <svg
                  class="w-3 h-3 opacity-60 sort-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="http://www.w3.org/2000/svg"
                >
                  <path d="M7 10l5-6 5 6H7zm0 4h10l-5 6-5-6z" />
                </svg>
              </button>
            </th>
          </tr>
        </thead>
        <tbody id="markets-tbody" class="bg-white dark:bg-gray-900"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between mt-4">
      <p
        id="pagination-summary"
        class="text-sm text-gray-600 dark:text-gray-400"
      ></p>
      <nav aria-label="Table navigation">
        <ul id="pagination" class="inline-flex -space-x-px text-sm"></ul>
      </nav>
    </div>
  </div>
</section>
