<section class="bg-white dark:bg-gray-900 min-h-screen flex flex-col">
  <div class="max-w-screen-xl w-full mx-auto px-4 py-8 lg:py-12 text-center">
    <h1 class="mb-2 text-4xl font-extrabold text-gray-900 dark:text-white">
      Crypto Analytics
    </h1>
    <p class="text-gray-500 dark:text-gray-400">
      Advanced charts and technical analysis
    </p>
  </div>
  <div class="flex-1 flex items-center justify-center w-full h-full">
    <div class="w-full max-w-screen-xl h-full flex flex-col justify-center">
      <div
        class="w-full h-full bg-white dark:bg-gray-800 rounded-lg shadow p-4 flex flex-col"
      >
        <div
          class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-4"
        >
          <div
            id="metric-price"
            class="text-3xl font-bold text-gray-900 dark:text-white"
          >
            --
          </div>
          <div
            id="metric-change"
            class="text-base font-medium text-green-500 dark:text-green-400"
          >
            --
          </div>
        </div>
        <div
          id="analytics-chart"
          class="flex-1 min-h-[300px] h-full w-full"
        ></div>
        <div class="flex gap-2">
          <select
            id="coin-select"
            class="p-2 rounded border border-gray-300 dark:bg-gray-800 dark:text-white dark:border-gray-700"
          >
            <option value="bitcoin">BTC</option>
            <option value="ethereum">ETH</option>
            <option value="solana">SOL</option>
          </select>
          <select
            id="period-select"
            class="p-2 rounded border border-gray-300 dark:bg-gray-800 dark:text-white dark:border-gray-700"
          >
            <option value="1">1D</option>
            <option value="7">1W</option>
            <option value="30">1M</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</section>
